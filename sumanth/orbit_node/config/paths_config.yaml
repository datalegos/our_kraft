# File Paths Configuration
# All paths are relative to SHARED_DATA_PATH environment variable
# Default: ../njs_shared_data (sibling to project directory)

paths:
  # Shared data root (set via SHARED_DATA_PATH env var)
  # In Docker: /shared_data
  # On host: ../njs_shared_data
  shared_data_root: "${SHARED_DATA_PATH}"
  
  # Base directory for collected data (relative to shared_data_root)
  # This should point to the timestamped folder containing all collected data
  base_directory: "data/collected/20260210_201344"
  
  # Alternative: Use latest collected data automatically
  # Set to null to use base_directory, or set to "latest" to auto-detect latest folder
  use_latest: true
  
  # Data source directories (relative to base_directory)
  data_sources:
    agents_manager:
      directory: "agents_manager"
      file_pattern: "All_Agents.json"
      description: "Wazuh Manager agents data"
      required: true
    
    host:
      directory: "host"
      file_pattern: "Syscollector_OS_Info_{agent_id}.json"
      description: "Host/OS information from syscollector"
      required: false
    
    packages:
      directory: "packages"
      file_pattern: "Syscollector_Packages_{agent_id}.json"
      description: "Installed packages from syscollector"
      required: false
    
    hardware:
      directory: "hardware"
      file_pattern: "Syscollector_Hardware_{agent_id}.json"
      description: "Hardware information from syscollector"
      required: false
    
    cpe:
      directory: "cpe"
      file_pattern: "Syscollector_CPE_{agent_id}.json"
      description: "CPE (Common Platform Enumeration) identifiers from syscollector"
      required: false
    
    fim:
      directory: "fim"
      file_pattern: "File_Integrity_Monitoring_{agent_id}.json"
      description: "File Integrity Monitoring data"
      required: false
    
    groups:
      directory: "groups"
      file_pattern: "Groups_List.json"
      description: "Agent groups information"
      required: false
    
    vulnerabilities:
      directory: "vulnerabilities"
      file_pattern: "Vulnerabilities_{agent_id}.json"
      description: "Vulnerability data from indexer"
      required: false
  
  # Output directories (all relative to shared_data_root)
  output_directory: "data/extracted"
  
  # Output directory for aggregated data (intermediate)
  aggregated_directory: "data/aggregated"
  
  # Output directory for aggregated core data (final output for Core Graph)
  aggregated_core_directory: "data/aggregated_core"
  
  # Output directory for PII scan results
  pii_scan_results_directory: "data/pii_scan_results"
  
  # Logging
  log_directory: "logs"
  
  # Pipeline state markers
  pipeline_directory: "pipeline"

# Directory structure in njs_shared_data:
# njs_shared_data/
# ├── config/              # Runtime config (copied from project)
# ├── data/
# │   ├── collected/       # Raw data from Wazuh
# │   ├── extracted/       # Normalized data for Node Graph
# │   ├── aggregated/      # Intermediate aggregations
# │   ├── aggregated_core/ # Final aggregations for Core Graph
# │   └── pii_scan_results/# PII detection results
# ├── logs/                # All pipeline logs
# └── pipeline/            # Pipeline state (.done files)

