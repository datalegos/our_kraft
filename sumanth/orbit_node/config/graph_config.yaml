# Graph Node Configuration
# Defines properties for each node type in the knowledge graph

nodes:
  asset:
    label: "NJS_Asset"
    description: "Wazuh agents/assets in the knowledge graph"
    
    # Constraints and indexes for this node type
    constraints:
      # Unique constraint on asset_id (primary key)
      unique_asset_id:
        type: "UNIQUE"
        properties: ["asset_id"]
        description: "Wazuh agent_id is stable and unique"
        enabled: true
      
      # Example: Add more constraints in the future
      # index_asset_name:
      #   type: "INDEX"
      #   properties: ["asset_name"]
      #   description: "Index on asset name for faster lookups"
      #   enabled: false
    
    properties:
      # Required properties from Wazuh agent data
      asset_id:
        source_field: "id"
        source_path: "data.affected_items[].id"
        data_type: "string"
        required: true
        description: "Wazuh agent ID (primary key)"
      
      asset_name:
        source_field: "name"
        source_path: "data.affected_items[].name"
        data_type: "string"
        required: true
        description: "Hostname"
      
      asset_type:
        source_field: null  # Not available in Wazuh data, use default
        source_path: null
        data_type: "enum"
        default_value: "vm"
        enum_values: ["host", "vm", "container"]
        required: true
        description: "Type of asset (host, vm, or container)"
      
      status:
        source_field: "status"
        source_path: "data.affected_items[].status"
        data_type: "enum"
        enum_values: ["active", "disconnected"]
        required: true
        description: "Current status of the asset"
      
      first_seen_at:
        source_field: "dateAdd"
        source_path: "data.affected_items[].dateAdd"
        data_type: "datetime"
        required: false
        description: "Timestamp when asset was first discovered"
      
      last_seen_at:
        source_field: "lastKeepAlive"
        source_path: "data.affected_items[].lastKeepAlive"
        data_type: "datetime"
        required: false
        description: "Timestamp of last telemetry received from asset"
      
      # Default properties (not available in Wazuh data yet)
      is_crown_jewel:
        source_field: null
        source_path: null
        data_type: "boolean"
        default_value: false
        required: true
        description: "Business criticality flag"
      
      classification_reason:
        source_field: null
        source_path: null
        data_type: "string"
        default_value: "Yet to be classified"
        required: true
        description: "Reason why asset is classified as crown jewel"
      
      classified_at:
        source_field: null
        source_path: null
        data_type: "datetime"
        default_value: null
        required: false
        description: "Timestamp when asset's crown jewel classification was made"
      
      created_at:
        source_field: "dateAdd"
        source_path: "data.affected_items[].dateAdd"
        data_type: "datetime"
        required: true
        description: "Timestamp when asset was first created/registered (agent add_time)"
      
      last_modified:
        source_field: "lastKeepAlive"
        source_path: "data.affected_items[].lastKeepAlive"
        data_type: "datetime"
        required: true
        fallback_field: "dateAdd"
        fallback_path: "data.affected_items[].dateAdd"
        description: "Timestamp of last modification (from lastKeepAlive, fallback to dateAdd if null or 9999-12-31)"
      
      # group:
      #   source_field: "group"
      #   source_path: "data.affected_items[].group"
      #   data_type: "array"
      #   required: false
      #   description: "Array of group names the asset belongs to (for AssetGroup relationship)"

  host:
    label: "NJS_Host"
    description: "Operating system and platform identity"
    
    # Constraints and indexes for this node type
    constraints:
      # Composite unique constraint on agent_id + os_name (primary key)
      unique_host_composite:
        type: "UNIQUE"
        properties: ["agent_id", "os_name"]
        description: "Primary key could be composite key of (agent_id + os_name)"
        enabled: true
        composite: true  # Indicates this is a composite constraint
    
    properties:
      # Composite key properties
      agent_id:
        source_field: "agent_id"
        source_path: "data.affected_items[].agent_id"
        data_type: "string"
        required: true
        description: "Wazuh agent ID (part of composite key)"
      
      os_name:
        source_field: "os.name"
        source_path: "data.affected_items[].os.name"
        data_type: "string"
        required: true
        description: "Operating system name (part of composite key)"
      
      # Other host properties
      os_version:
        source_field: "os.version"
        source_path: "data.affected_items[].os.version"
        data_type: "string"
        required: false
        description: "Operating system version"
      
      architecture:
        source_field: "architecture"
        source_path: "data.affected_items[].architecture"
        data_type: "string"
        required: false
        description: "System architecture"
      
      platform:
        source_field: "os.platform"
        source_path: "data.affected_items[].os.platform"
        data_type: "string"
        required: false
        description: "Platform identifier"
      
      created_at:
        source_field: "scan.time"
        source_path: "data.affected_items[].scan.time"
        data_type: "datetime"
        required: true
        description: "Timestamp when host was first discovered (from scan.time)"
      
      last_modified:
        source_field: "scan.time"
        source_path: "data.affected_items[].scan.time"
        data_type: "datetime"
        required: true
        description: "Timestamp of last scan/modification (from scan.time)"

  software:
    label: "NJS_Software"
    description: "Installed software or service"
    
    # Constraints and indexes for this node type
    constraints:
      # Unique constraint on name only (primary key)
      unique_software_name:
        type: "UNIQUE"
        properties: ["name"]
        description: "Software name is unique identifier (no agent_id constraint)"
        enabled: true
    
    properties:
      # Primary key property
      name:
        source_field: "name"
        source_path: "data.affected_items[].name"
        data_type: "string"
        required: true
        description: "Software name (unique identifier, primary key)"
      
      version:
        source_field: "version"
        source_path: "data.affected_items[].version"
        data_type: "string"
        required: false
        description: "Software version (optional property)"
      
      # Other software properties
      vendor:
        source_field: "vendor"
        source_path: "data.affected_items[].vendor"
        data_type: "string"
        required: false
        description: "Software vendor"
      
      architecture:
        source_field: "architecture"
        source_path: "data.affected_items[].architecture"
        data_type: "string"
        required: false
        description: "Software architecture (extra property)"
      
      format:
        source_field: "format"
        source_path: "data.affected_items[].format"
        data_type: "string"
        required: false
        description: "Package format (e.g., rpm, deb) (extra property)"
      
      cpe:
        source_field: null  # Not available in Wazuh data yet
        source_path: null
        data_type: "string"
        default_value: null
        required: false
        description: "Common Platform Enumeration (CPE) identifier (optional)"
      
      created_at:
        source_field: "install_time"
        source_path: "data.affected_items[].install_time"
        data_type: "datetime"
        required: true
        fallback_field: "scan.time"
        fallback_path: "data.affected_items[].scan.time"
        description: "Timestamp when software was first installed (from install_time, fallback to scan.time if null)"
      
      last_modified:
        source_field: "scan.time"
        source_path: "data.affected_items[].scan.time"
        data_type: "datetime"
        required: true
        description: "Timestamp of last scan/modification (from scan.time, always present)"

  vulnerability:
    label: "NJS_Vulnerability"
    description: "A CVE or known weakness"
    
    # Constraints and indexes for this node type
    constraints:
      # Unique constraint on cve_id (primary key)
      unique_cve_id:
        type: "UNIQUE"
        properties: ["cve_id"]
        description: "CVE is global identifier"
        enabled: true
    
    properties:
      # Primary key property
      cve_id:
        source_field: "cve"
        source_path: "data.affected_items[].cve"
        data_type: "string"
        required: true
        description: "CVE identifier (primary key, global identifier)"
      
      # Other vulnerability properties
      cvss_score:
        source_field: "cvss.base_score"
        source_path: "data.affected_items[].cvss.base_score"
        data_type: "float"
        required: false
        description: "CVSS base score"
        # Note: cvss may be empty object {}, handle null case
      
      severity:
        source_field: "severity"
        source_path: "data.affected_items[].severity"
        data_type: "enum"
        enum_values: ["Critical", "High", "Medium", "Low", "Info"]
        required: false
        description: "Vulnerability severity level"
      
      published_at:
        source_field: "published"
        source_path: "data.affected_items[].published"
        data_type: "datetime"
        required: false
        description: "Date when vulnerability was published"
      
      status:
        source_field: "status"
        source_path: "data.affected_items[].status"
        data_type: "enum"
        enum_values: ["open", "mitigated", "PENDING", "VALID"]
        default_value: "open"  # Default to "open" if status is empty
        required: false
        description: "Vulnerability status (open/mitigated)"
      
      # Note: package_name and package_version removed - relationships use source-based matching
      
      title:
        source_field: "title"
        source_path: "data.affected_items[].title"
        data_type: "string"
        required: false
        description: "Vulnerability title"
      
      description:
        source_field: "description"
        source_path: "data.affected_items[].description"
        data_type: "string"
        required: false
        description: "Vulnerability description"
      
      created_at:
        source_field: "published"
        source_path: "data.affected_items[].published"
        data_type: "datetime"
        required: true
        fallback_field: "timestamp"
        fallback_path: "data.affected_items[].timestamp"
        description: "Timestamp when vulnerability was first published (from published, fallback to timestamp if null)"
      
      last_modified:
        source_field: "timestamp"
        source_path: "data.affected_items[].timestamp"
        data_type: "datetime"
        required: true
        fallback_field: "published"
        fallback_path: "data.affected_items[].published"
        description: "Timestamp of last modification/update (from timestamp, fallback to published if null)"

  assetgroup:
    label: "NJS_AssetGroup"
    description: "Logical segmentation of assets (groups)"
    
    # Constraints and indexes for this node type
    constraints:
      # Unique constraint on name (primary key)
      unique_assetgroup_name:
        type: "UNIQUE"
        properties: ["name"]
        description: "Group name is unique identifier"
        enabled: true
    
    properties:
      # Primary key property
      name:
        source_field: "name"
        source_path: "data.affected_items[].name"
        data_type: "string"
        required: true
        description: "Group name (primary key)"
      
      # Number of agents in the group
      agent_count:
        source_field: "count"
        source_path: "data.affected_items[].count"
        data_type: "integer"
        required: false
        description: "Number of agents in the group"
      
      created_at:
        source_field: null
        source_path: null
        data_type: "datetime"
        default_value: null
        required: true
        description: "Timestamp when group was first created (defaults to current time if not available)"
      
      last_modified:
        source_field: null
        source_path: null
        data_type: "datetime"
        default_value: null
        required: true
        description: "Timestamp of last modification (defaults to current time if not available)"

  hardware:
    label: "NJS_Hardware"
    description: "Hardware information for assets"
    
    # Constraints and indexes for this node type
    constraints:
      # Composite unique constraint on agent_id + name (primary key)
      unique_hardware_composite:
        type: "UNIQUE"
        properties: ["agent_id", "name"]
        description: "Hardware is unique per agent and CPU name. Composite key: (agent_id + name)"
        enabled: true
        composite: true  # Indicates this is a composite constraint
    
    properties:
      # Composite key properties
      agent_id:
        source_field: "agent_id"
        source_path: "data.affected_items[].agent_id"
        data_type: "string"
        required: true
        description: "Agent ID (part of composite key, links to Asset)"
      
      name:
        source_field: "cpu.name"
        source_path: "data.affected_items[].cpu.name"
        data_type: "string"
        required: true
        description: "CPU name (part of composite key)"
      
      # Other hardware properties
      scan_time:
        source_field: "scan.time"
        source_path: "data.affected_items[].scan.time"
        data_type: "datetime"
        required: false
        description: "Timestamp of the hardware scan"
      
      board_serial:
        source_field: "board_serial"
        source_path: "data.affected_items[].board_serial"
        data_type: "string"
        required: false
        description: "Board serial number"
      
      created_at:
        source_field: "scan.time"
        source_path: "data.affected_items[].scan.time"
        data_type: "datetime"
        required: true
        description: "Timestamp when hardware was first discovered (from scan.time)"
      
      last_modified:
        source_field: "scan.time"
        source_path: "data.affected_items[].scan.time"
        data_type: "datetime"
        required: true
        description: "Timestamp of last scan/modification (from scan.time)"

# Relationships configuration
relationships:
  asset_to_host:
    from_node: "asset"
    to_node: "host"
    type: "NJS_HAS_OS"
    description: "Asset HAS_OS Host (operating system)"
    enabled: true
    # Match criteria: Use source-based matching - match Asset.asset_id with Host.os_name via source
    # Load host data, extract os_name, match with Host nodes
    match_criteria:
      from_source:
        source_field: "os.name"
        source_path: "data.affected_items[]"
        source_file: "Syscollector_OS_Info_{agent_id}.json"
        source_directory: "host"
        from_node_key_property: "asset_id"
        source_key_field: "agent_id"
      to_property: "os_name"
      description: "Match Asset.asset_id (via source agent_id) with Host.os_name (from source os.name)"
  
  host_to_software:
    from_node: "host"
    to_node: "software"
    type: "NJS_INSTALLED_ON"
    description: "Software INSTALLED_ON Host"
    enabled: true
    # Match criteria: Use source-based matching - match Host.agent_id with Software.name via packages source
    match_criteria:
      from_source:
        source_field: "name"
        source_path: "data.affected_items[]"
        source_file: "Syscollector_Packages_{agent_id}.json"
        source_directory: "packages"
        from_node_key_property: "agent_id"
        source_key_field: "agent_id"
      to_property: "name"
      description: "Match Host.agent_id (via source agent_id) with Software.name from packages"
  
  asset_to_software:
    from_node: "asset"
    to_node: "software"
    type: "NJS_HAS_SOFTWARE"
    description: "Asset HAS_SOFTWARE Software"
    enabled: true
    # Match criteria: Use source-based matching - match Asset.asset_id with Software.name
    match_criteria:
      from_source:
        source_field: "name"
        source_path: "data.affected_items[]"
        source_file: "Syscollector_Packages_{agent_id}.json"
        source_directory: "packages"
        from_node_key_property: "asset_id"
        source_key_field: "agent_id"
      to_property: "name"
      description: "Match Asset.asset_id (via source agent_id) with Software.name"
  
  software_to_vulnerability:
    from_node: "software"
    to_node: "vulnerability"
    type: "NJS_VULNERABLE_TO"
    description: "Software VULNERABLE_TO Vulnerability"
    enabled: true
    # Match criteria: Use source-based matching - match Software.name with Vulnerability.package_name
    # Load all vulnerability files and match by package_name
    match_criteria:
      from_source:
        source_field: "package_name"
        source_path: "data.affected_items[]"
        source_file: "Vulnerabilities_{agent_id}.json"
        source_directory: "vulnerabilities"
        from_node_key_property: "name"
        source_key_field: "package_name"
        load_all_agents: true
      to_property: "cve_id"
      description: "Match Software.name with Vulnerability.package_name (from source), then link to Vulnerability by cve_id"
  
  asset_to_vulnerability:
    from_node: "asset"
    to_node: "vulnerability"
    type: "NJS_AFFECTED_BY"
    description: "Asset AFFECTED_BY Vulnerability"
    enabled: true
    # Match criteria: Use source-based matching - match Asset.asset_id with Vulnerability.cve_id via source agent_id
    # Load all vulnerability files and match by agent_id
    match_criteria:
      from_source:
        source_field: "cve"
        source_path: "data.affected_items[]"
        source_file: "Vulnerabilities_{agent_id}.json"
        source_directory: "vulnerabilities"
        from_node_key_property: "asset_id"
        source_key_field: "agent_id"
        load_all_agents: true
      to_property: "cve_id"
      description: "Match Asset.asset_id (via source agent_id) with Vulnerability.cve_id (from source cve field)"
  
  asset_to_assetgroup:
    from_node: "asset"
    to_node: "assetgroup"
    type: "NJS_BELONGS_TO"
    description: "Asset BELONGS_TO AssetGroup (logical segmentation)"
    enabled: true
    # Match criteria: Fetch group data directly from source file for efficiency
    match_criteria:
      from_source:
        source_field: "group"
        source_path: "data.affected_items[]"
        source_file: "All_Agents.json"
        source_directory: "agents_manager"
        from_node_key_property: "asset_id"
        source_key_field: "id"  # Field in source that matches from_node_key_property
        array_match: true  # Indicates this is an array field
      to_property: "name"
      description: "Match Asset.asset_id (from source id) with Asset.group array containing AssetGroup.name"
  
  asset_to_hardware:
    from_node: "asset"
    to_node: "hardware"
    type: "NJS_HAS_HARDWARE"
    description: "Asset HAS_HARDWARE Hardware"
    enabled: true
    # Match criteria: Use source-based matching - match Asset.asset_id with Hardware.name via source
    match_criteria:
      from_source:
        source_field: "cpu.name"
        source_path: "data.affected_items[]"
        source_file: "Syscollector_Hardware_{agent_id}.json"
        source_directory: "hardware"
        from_node_key_property: "asset_id"
        source_key_field: "agent_id"
      to_property: "name"
      description: "Match Asset.asset_id (via source agent_id) with Hardware.name (from source cpu.name)"

# File source configuration
file_sources:
  asset:
    file_pattern: "All_Agents.json"
    directory_key: "agents_manager"
    description: "Main agents data file from Wazuh Manager"
    per_agent: false
  
  agents:
    file_pattern: "All_Agents.json"
    directory_key: "agents_manager"
    description: "Main agents data file from Wazuh Manager (alias for asset)"
    per_agent: false
  
  host:
    file_pattern: "Syscollector_OS_Info_{agent_id}.json"
    directory_key: "host"
    description: "Host/OS information from syscollector"
    per_agent: true  # Indicates files are organized per agent
  
  software:
    file_pattern: "Syscollector_Packages_{agent_id}.json"
    directory_key: "packages"
    description: "Installed packages/software from syscollector"
    per_agent: true  # Indicates files are organized per agent
  
  vulnerability:
    file_pattern: "Vulnerabilities_{agent_id}.json"
    directory_key: "vulnerabilities"
    description: "Vulnerability data from Wazuh Indexer"
    per_agent: true  # Indicates files are organized per agent
  
  assetgroup:
    file_pattern: "Groups_List.json"
    directory_key: "groups"
    description: "Asset groups from Wazuh Manager"
    per_agent: false  # Single file for all groups
  
  hardware:
    file_pattern: "Syscollector_Hardware_{agent_id}.json"
    directory_key: "hardware"
    description: "Hardware information from syscollector"
    per_agent: true  # Indicates files are organized per agent

