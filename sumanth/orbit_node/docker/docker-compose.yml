version: '3.8'

# DataLegos Pipeline Stack
# Orchestrates Neo4j and Pipeline containers with shared data volume

services:
  # Neo4j Database - Hosts both node_kg and core databases
  neo4j:
    image: neo4j:5.15.0
    container_name: datalegos_neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-changeme}
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"  # HTTP
      - "${NEO4J_BOLT_PORT:-7687}:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    networks:
      - datalegos_network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USERNAME:-neo4j}", "-p", "${NEO4J_PASSWORD:-changeme}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # DataLegos Pipeline Container
  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: datalegos_pipeline
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      # Wazuh Configuration
      - WAZUH_API_URL=${WAZUH_API_URL}
      - WAZUH_API_USERNAME=${WAZUH_API_USERNAME}
      - WAZUH_API_PASSWORD=${WAZUH_API_PASSWORD}
      
      # Neo4j Configuration
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - NEO4J_NODE_DATABASE=${NEO4J_NODE_DATABASE:-node_kg}
      - NEO4J_CORE_DATABASE=${NEO4J_CORE_DATABASE:-core}
      
      # Bank Configuration
      - BANK_ID=${BANK_ID:-bank_001}
      
      # Pipeline Configuration
      - PIPELINE_MODE=${PIPELINE_MODE:-run-once}
      - PIPELINE_SCHEDULE=${PIPELINE_SCHEDULE:-0 2 * * *}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Shared Data Path (inside container)
      - SHARED_DATA_PATH=/shared_data
    volumes:
      # Shared data volume - sibling to project directory
      # This is mounted from host: ../orbit_node_shared_data
      - ../orbit_node_shared_data:/shared_data
      
      # Config files (read-only)
      - ../config:/app/config:ro
      
      # Scripts (for development - can be removed in production)
      - ../scripts:/app/scripts:ro
    networks:
      - datalegos_network
    restart: unless-stopped
    # Uncomment for scheduled runs
    # command: ["run-scheduled"]

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local

networks:
  datalegos_network:
    driver: bridge
