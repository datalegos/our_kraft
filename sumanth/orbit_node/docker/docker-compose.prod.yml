# Production Docker Compose Override
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  neo4j:
    # Production Neo4j configuration
    environment:
      # Increase memory for production
      - NEO4J_dbms_memory_heap_max__size=4G
      - NEO4J_dbms_memory_pagecache_size=2G
      
      # Enable query logging
      - NEO4J_dbms_logs_query_enabled=true
      - NEO4J_dbms_logs_query_threshold=1s
      
      # Security settings
      - NEO4J_dbms_security_auth__minimum__password__length=12
      
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G
        reservations:
          cpus: '2'
          memory: 4G
    
    # Restart policy
    restart: always
    
    # Don't expose ports (use SSH tunnel instead)
    ports: []
    
    # Health check with longer intervals
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  pipeline:
    # Production pipeline configuration
    environment:
      # Production logging
      - LOG_LEVEL=INFO
      
      # Longer timeouts for production
      - PIPELINE_TIMEOUT=7200  # 2 hours
      
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    
    # Restart policy
    restart: always
    
    # Remove development volume mounts
    volumes:
      # Shared data volume only
      - /opt/datalegos_shared_data:/shared_data
      
      # Config files (read-only)
      - ../config:/app/config:ro
    
    # Production command (scheduled mode)
    # Uncomment to enable scheduled runs
    # command: ["run-scheduled"]

# Production volumes with specific drivers
volumes:
  neo4j_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/datalegos/neo4j_data
  
  neo4j_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/datalegos/neo4j_logs
  
  neo4j_import:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/datalegos/neo4j_import
