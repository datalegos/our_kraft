# Configuration for different user types
# Change 'user_type' to test different scenarios

# ANONYMOUS USER (minimal data, generalized news)
user_type: "anonymous"

# NEW USER (location-based news only)
# user_type: "new_user"

# EXISTING USER (full personalization)
# user_type: "existing_user"

# User profile information
user_profile:
  country: "India"
  state: "Karnataka"
  district: "Bangalore"
  preferred_category: "technology"
  preferred_language: "english"

# User history (only used for existing users)
history:
  bookmarks: 
    - "AI advancements in healthcare"
    - "Renewable energy solutions"
    - "Space exploration news"
  likes: 
    - "technology"
    - "science"
    - "innovation"
  search_topics: 
    - "artificial intelligence"
    - "machine learning"
    - "climate change"
    - "electric vehicles"

# Examples for testing different scenarios:

# Anonymous User Example:
# user_type: "anonymous"
# (No personalization data needed)

# New User Example:
# user_type: "new_user"
# history:
#   bookmarks: []
#   likes: []
#   search_topics: []

# Existing User Example:
# user_type: "existing_user"
# (Full history and preferences used)