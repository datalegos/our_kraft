version: '3.8'

services:
  # Authentication API
  auth-api:
    build: ./authentication
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=news_auth_super_secret_key_2024
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=news_auth_db
    depends_on:
      - mysql
    volumes:
      - ./authentication:/app
    networks:
      - news-network

  # Feed API
  feed-api:
    build: ./feed-api
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NEWS_API_KEY=${NEWS_API_KEY}
    volumes:
      - ./feed-api:/app
    networks:
      - news-network

  # Tokenization API
  tokenization-api:
    build: ./tokenization-api
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
    volumes:
      - ./tokenization-api:/app
    networks:
      - news-network

  # Summarization API
  summarization-api:
    build: ./summarization-api
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TOKENIZATION_API_URL=http://tokenization-api:5002
    depends_on:
      - tokenization-api
    volumes:
      - ./summarization-api:/app
    networks:
      - news-network

  # Scraping API
  scraping-api:
    build: ./scraping-api
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - MAX_CONCURRENT_REQUESTS=5
      - REQUEST_TIMEOUT=10
    volumes:
      - ./scraping-api:/app
    networks:
      - news-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=news_auth_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - news-network

volumes:
  mysql_data:

networks:
  news-network:
    driver: bridge