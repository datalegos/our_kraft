# Vendor Normalization Map
# Maps messy Wazuh vendor strings to clean NVD-compatible vendor names
# Add new vendors as new banks onboard with different software

vendor_mappings:
  # Microsoft variants
  "Microsoft Corporation": "microsoft"
  "Microsoft Corp.": "microsoft"
  "Microsoft Corp": "microsoft"
  "Microsoft Studios": "microsoft"
  "Microsoft": "microsoft"
  
  # Google variants
  "Google LLC": "google"
  "Google": "google"
  
  # Amazon variants
  "Amazon Web Services": "amazon"
  "Amazon": "amazon"
  
  # Anaconda
  "Anaconda, Inc.": "anaconda"
  "Anaconda": "anaconda"
  
  # Anysphere
  "Anysphere": "anysphere"
  
  # Docker
  "Docker Inc.": "docker"
  "Docker": "docker"
  
  # Dolby
  "Dolby Laboratories": "dolby"
  "Dolby": "dolby"
  
  # ELAN
  "ELAN Microelectronics Corporation": "elan"
  "ELAN": "elan"
  
  # EnterpriseDB
  "EnterpriseDB": "enterprisedb"
  
  # Lenovo variants
  "LENOVO INC": "lenovo"
  "LENOVO INC.": "lenovo"
  "Lenovo": "lenovo"
  "Lenovo Group Ltd.": "lenovo"
  
  # McAfee
