services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: school_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - school_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-school_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Don't expose port in production - only internal access

  # School Management Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_app_prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-school_db}
      PYTHONPATH: /app
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      - school_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    # Remove development volume mounts

  # Database Migration Service (runs once)
  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_migration_prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-school_db}
      PYTHONPATH: /app
    networks:
      - school_network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        sleep 10 &&
        echo 'Running database migrations...' &&
        cd database &&
        alembic revision --autogenerate -m 'Initial migration' || echo 'Migration already exists' &&
        alembic upgrade head &&
        echo 'Migrations completed successfully!'
      "
    restart: "no"

volumes:
  postgres_data:
    driver: local

networks:
  school_network:
    driver: bridge