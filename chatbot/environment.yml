name: practice
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.13.3
  - pip

  # Web scraping
  - beautifulsoup4
  - requests
  - pyyaml
  # Development tools
  - pytest
  - black
  - flake8
  # Pip-only packages (not available in conda)
  - pip:
      - gradio
      - langchain
      - langchain-community
      - langchain-text-splitters
      - faiss-cpu
      - sentence-transformers
      - python-dotenv
      - openai
